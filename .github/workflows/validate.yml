name: validate

# Pre-merge checks; the main ruleset requires lint, test and scripts. Live checks need the
# Apple TV (tvctl, AGENTS.md), so they stay local.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# The image's default Xcode is older than the local toolchain and its SDK refuses the 27.2
# deployment target; build with an Xcode whose SDK matches. Move with the local toolchain.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  lint:
    runs-on: xcode-27
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: sw_vers && xcodebuild -version && swift --version
      - name: lint
        run: make lint

  test:
    runs-on: xcode-27
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the bundle version counts commits
      - name: test
        run: make test
      - name: release dry run
        run: scripts/release.sh
        env:
          REMOTETV_SIGN_IDENTITY: "-"
      - name: check cask
        run: brew style --only-cops Cask build/release/remotetv.rb # outside a tap, only the cask rules apply

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
